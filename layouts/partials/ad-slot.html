{{- $page := .page -}}
{{- $slot := .slot | default "in-article" -}}
{{- $adsense := strings.TrimSpace ($page.Site.Params.adsenseClient | default "") -}}
{{- if $adsense -}}
<aside class="qti-ad qti-ad-{{ $slot }}" aria-label="광고 영역">
  <span class="qti-ad-label">광고</span>
  {{- if eq $slot "in-article" -}}
  <ins class="adsbygoogle"
       style="display:block;text-align:center;width:100%;"
       data-ad-layout="in-article"
       data-ad-format="fluid"
       data-ad-client="{{ $adsense }}"></ins>
  {{- else -}}
  <ins class="adsbygoogle"
       style="display:block;width:100%;"
       data-ad-client="{{ $adsense }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  {{- end -}}
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
{{- end -}}
